[package]
name = "hbench"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
minijinja = "3.0.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
tiny_http = "0.12.0"
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.8"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
