[package]
name = "hbench"
version = "0.3.9"
edition = "2024"
description = "Benchmark runner for coding-agent harnesses, the engine behind Harness Playground"
license = "Apache-2.0"
repository = "https://github.com/node-q/hbench"
homepage = "https://nodeq.tech"
readme = "README.md"
publish = false

[dependencies]
aho-corasick = "1.1.5"
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
dialoguer = { version = "0.12", default-features = false }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3.34", default-features = false }
http = "1.5.0"
minijinja = "3.0.0"
oci-client = { version = "0.18.0", default-features = false, features = ["rustls-tls-no-provider"] }
oci-spec = { version = "0.10.0", default-features = false, features = ["image"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
serde_yaml_ng = "0.10.0"
sha2 = "0.11.0"
tar = { version = "0.4.46", default-features = false }
tiktoken-rs = "0.12.1"
tiny_http = "0.12.0"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "process", "signal", "sync", "time", "io-util"] }
toml = { version = "1.1.8", features = ["preserve_order"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
