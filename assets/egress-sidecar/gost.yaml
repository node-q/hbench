# Modified by the hbench authors.
# addr, so_mark, and file.path must stay in sync with the constants in
# bin/network-policy (GOST_PORT, GOST_MARK, ALLOWLIST) and src/env.rs
# (PROXY_PORT); the `reload` interval must stay below RELOAD_WAIT there.
services:
  # nft+proxy: nftables redirects the task container's TCP here.
  - name: transparent-egress
    addr: ":12345"
    bypass: allowlist
    metadata:
      so_mark: 114514
    handler:
      type: red
      metadata:
        sniffing: true
        sniffing.timeout: 5s
        sniffing.fallback: true
    listener:
      type: red
  # Both methods: the HTTP/CONNECT proxy HTTP_PROXY and HTTPS_PROXY point at.
  - name: http-proxy
    addr: ":3128"
    bypass: allowlist
    metadata:
      so_mark: 114514
    handler:
      type: http
    listener:
      type: tcp

bypasses:
  - name: allowlist
    whitelist: true
    reload: 1s
    file:
      path: /opt/egress-sidecar/allowlist.txt

# Debug is the level that names the host of a refused connection.
log:
  level: debug
  format: json
