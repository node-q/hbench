schema_version = "1.4"

[task]
name = "hbench/hello-workdir"
version = "1.0.0"
description = "Checks that [environment].workdir sets the directory commands start in."

[metadata]
author_name = "hbench"
difficulty = "easy"
category = "programming"
tags = ["trivial", "workdir"]

[agent]
timeout_sec = 120.0

[verifier]
timeout_sec = 120.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
workdir = "/custom-workdir"
