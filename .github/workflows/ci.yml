name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# GitHub-hosted runners. Linux runs the full suite, including the e2e job against a real
# Docker daemon; macOS builds and runs the unit tests, since releases ship macOS binaries.
jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-24.04
    env:
      REGISTRY_IMAGE: registry:3@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
      - name: Build all targets
        run: cargo build --locked --all-targets
      - name: Run unit tests
        run: cargo test --locked
      - name: Start two local registries, the second taking basic auth
        run: |
          docker run -d --name registry -p 127.0.0.1:5000:5000 "$REGISTRY_IMAGE"
          auth_dir="$RUNNER_TEMP/registry-auth"
          mkdir "$auth_dir"
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          command -v htpasswd > /dev/null || sudo apt-get install -y --no-install-recommends apache2-utils
          htpasswd -Bbn hbench-test "$password" > "$auth_dir/htpasswd"
          docker run -d --name registry-auth -p 127.0.0.1:5001:5000 -v "$auth_dir:/auth:ro" \
            -e REGISTRY_AUTH=htpasswd -e REGISTRY_AUTH_HTPASSWD_REALM=hbench-test \
            -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd "$REGISTRY_IMAGE"
          echo "HBENCH_TEST_OCI_AUTH_CREDENTIALS=hbench-test:$password" >> "$GITHUB_ENV"
          for port in 5000 5001; do
            timeout 30 sh -c "until curl -so /dev/null http://localhost:$port/v2/; do sleep 1; done"
          done
      - name: Run the OCI dataset tests against the local registries
        run: cargo test --locked oci::tests
        env:
          HBENCH_TEST_OCI_REGISTRY: localhost:5000
          HBENCH_TEST_OCI_AUTH_REGISTRY: localhost:5001

  test-macos:
    name: Build & Test (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
      - name: Run unit tests
        run: cargo test --locked

  musl:
    # Release binaries are static musl builds, made the way release.yml makes them.
    name: Check musl targets
    runs-on: ubuntu-24.04
    env:
      CC_x86_64_unknown_linux_musl: clang
      CC_aarch64_unknown_linux_musl: clang
      AR_x86_64_unknown_linux_musl: llvm-ar
      AR_aarch64_unknown_linux_musl: llvm-ar
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - name: Put the toolchain's llvm-ar on PATH
        run: echo "$(rustc --print sysroot)/lib/rustlib/$(rustc --print host-tuple)/bin" >> "$GITHUB_PATH"
      - name: Check both musl targets
        run: cargo check --locked --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-musl

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        env:
          RUSTFLAGS: ""

  audit:
    # RustSec advisories for Cargo.lock.
    name: Security Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
      - name: Install cargo-audit
        # A cached binary of this version is reused; another version is replaced.
        run: cargo install cargo-audit --locked --version 0.22.2
        env:
          RUSTFLAGS: ""
      - name: Audit dependencies
        run: cargo audit

  viewer:
    # viewer/dist is committed and embedded by build.rs, so it must match viewer/src.
    name: Viewer Bundle
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: viewer
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build bundle
        run: npm run build
      - name: Verify committed bundle is up to date
        run: |
          git status --porcelain -- dist
          test -z "$(git status --porcelain -- dist)" || { echo "::error::viewer/dist is stale; run 'npm run build' in viewer/ and commit"; exit 1; }

  e2e:
    # The integrity guarantees (stopping the agent at timeout, the hidden-test scrub, the egress allowlist)
    # only show against a real daemon.
    name: E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
      - name: Run the e2e suite
        run: scripts/e2e.sh
        env:
          E2E_REQUIRE_NFT: "1"
