name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Every job runs on the org's self-hosted pool: GitHub refuses hosted jobs for this
# organisation over billing. The pool is Linux x64 only with no sudo, so macOS is not
# covered here; its jobs have a Docker daemon, which the e2e job uses.
jobs:
  # The router runners pick the pool for the jobs below: mothership's while one of
  # its runners is idle, either pool otherwise (infra's services/gh-runner-mothership).
  route:
    name: Route
    runs-on: [self-hosted, hpg-route]
    timeout-minutes: 2
    outputs:
      labels: ${{ steps.route.outputs.labels }}
    steps:
      - name: Pick the runner pool
        id: route
        uses: node-q/actions/runner-route@4d447ccec339824c49417463313800a2fbbcb210
        with:
          token: ${{ secrets.RUNNER_STATUS_TOKEN }}

  test:
    name: Build & Test
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.labels) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
      - name: Build all targets
        run: cargo build --locked --all-targets
      - name: Run unit tests
        run: cargo test --locked

  lint:
    name: Lint
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.labels) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        env:
          RUSTFLAGS: ""

  audit:
    # RustSec advisories for Cargo.lock.
    name: Security Audit
    runs-on: [self-hosted, linux, x64, hpg]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
      - name: Install cargo-audit
        run: command -v cargo-audit >/dev/null || cargo install cargo-audit --locked
        env:
          RUSTFLAGS: ""
      - name: Audit dependencies
        run: cargo audit

  viewer:
    # viewer/dist is committed and embedded by build.rs, so it must match viewer/src.
    name: Viewer Bundle
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.labels) }}
    defaults:
      run:
        working-directory: viewer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build bundle
        run: npm run build
      - name: Verify committed bundle is up to date
        run: |
          git status --porcelain -- dist
          test -z "$(git status --porcelain -- dist)" || { echo "::error::viewer/dist is stale; run 'npm run build' in viewer/ and commit"; exit 1; }

  e2e:
    # The integrity guarantees (stopping the agent at timeout, the hidden-test scrub, the egress allowlist)
    # only show against a real daemon.
    name: E2E
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.labels) }}
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
      - name: Run the e2e suite
        run: scripts/e2e.sh
        env:
          E2E_REQUIRE_NFT: "1"
