name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# GitHub-hosted runners. Linux runs the full suite, including the e2e job against a real
# Docker daemon; macOS and Windows build and run the unit tests, since releases ship their binaries.
# (Windows runners have no Linux-container Docker, so nothing there runs a trial.)
jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-24.04
    env:
      REGISTRY_IMAGE: registry:3@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
      - name: Build all targets
        run: cargo build --locked --all-targets
      - name: Run unit tests
        run: cargo test --locked
      - name: Start two local registries, the second taking basic auth
        run: |
          docker run -d --name registry -p 127.0.0.1:5000:5000 "$REGISTRY_IMAGE"
          auth_dir="$RUNNER_TEMP/registry-auth"
          mkdir "$auth_dir"
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          command -v htpasswd > /dev/null || sudo apt-get install -y --no-install-recommends apache2-utils
          htpasswd -Bbn hbench-test "$password" > "$auth_dir/htpasswd"
          docker run -d --name registry-auth -p 127.0.0.1:5001:5000 -v "$auth_dir:/auth:ro" \
            -e REGISTRY_AUTH=htpasswd -e REGISTRY_AUTH_HTPASSWD_REALM=hbench-test \
            -e REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd "$REGISTRY_IMAGE"
          echo "HBENCH_TEST_OCI_AUTH_CREDENTIALS=hbench-test:$password" >> "$GITHUB_ENV"
          for port in 5000 5001; do
            timeout 30 sh -c "until curl -so /dev/null http://localhost:$port/v2/; do sleep 1; done"
          done
      - name: Run the OCI dataset tests against the local registries
        run: cargo test --locked oci::tests
        env:
          HBENCH_TEST_OCI_REGISTRY: localhost:5000
          HBENCH_TEST_OCI_AUTH_REGISTRY: localhost:5001

  # Off for now: it waited long for a GitHub-hosted macOS runner and held up CI. Uncomment to run the unit tests
  # on macOS again (the desktop job below still builds hbench there).
  # test-macos:
  #   name: Build & Test (macOS)
  #   runs-on: macos-15
  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #       with:
  #         persist-credentials: false
  #     - name: Set up Rust toolchain
  #       uses: ./.github/actions/setup-rust
  #     - name: Run unit tests
  #       run: cargo test --locked

  test-windows:
    name: Build & Test (Windows)
    runs-on: windows-2025
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
      - name: Lint
        run: cargo clippy --locked --all-targets
      - name: Run unit tests
        run: cargo test --locked

  musl:
    # Release binaries are static musl builds, made the way release.yml makes them.
    name: Check musl targets
    runs-on: ubuntu-24.04
    env:
      CC_x86_64_unknown_linux_musl: clang
      CC_aarch64_unknown_linux_musl: clang
      AR_x86_64_unknown_linux_musl: llvm-ar
      AR_aarch64_unknown_linux_musl: llvm-ar
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - name: Put the toolchain's llvm-ar on PATH
        run: echo "$(rustc --print sysroot)/lib/rustlib/$(rustc --print host-tuple)/bin" >> "$GITHUB_PATH"
      - name: Check both musl targets
        run: cargo check --locked --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-musl

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --check
      - name: Test the beta channel's feed script
        run: scripts/beta-feed-test.sh
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        env:
          RUSTFLAGS: ""

  audit:
    # RustSec advisories for Cargo.lock.
    name: Security Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
      - name: Install cargo-audit
        # A cached binary of this version is reused; another version is replaced.
        run: cargo install cargo-audit --locked --version 0.22.2
        env:
          RUSTFLAGS: ""
      - name: Audit dependencies
        run: cargo audit

  viewer:
    # viewer/dist is committed and embedded by build.rs, so it must match viewer/src.
    name: Viewer Bundle
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: viewer
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build bundle
        run: npm run build
      - name: Verify committed bundle is up to date
        run: |
          git status --porcelain -- dist
          test -z "$(git status --porcelain -- dist)" || { echo "::error::viewer/dist is stale; run 'npm run build' in viewer/ and commit"; exit 1; }

  desktop:
    # The release builds the desktop app (desktop/) the same way; this keeps that build working.
    name: Desktop App (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-15
            bundles: app
          # The oldest Ubuntu the release supports: its glibc and WebKitGTK are the app's minimum.
          - name: Linux
            runner: ubuntu-22.04
            bundles: deb,rpm
          - name: Windows
            runner: windows-2025
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        # Windows runners default to PowerShell.
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install WebKitGTK and build dependencies
        if: runner.os == 'Linux'
        run: sh desktop/scripts/linux-deps.sh
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Build hbench as the app's sidecar
        run: sh desktop/scripts/sidecar.sh debug
      - name: Lint the app
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked
      - name: Test the app
        if: runner.os == 'Linux'
        working-directory: desktop/src-tauri
        run: cargo test --locked
      - name: Build and bundle the app
        working-directory: desktop
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: |
          npm ci --ignore-scripts
          # As a beta on Linux: rpm refuses a version with "-", so the bundler must turn it into "~". This workspace only.
          if [ "$RUNNER_OS" = Linux ]; then sh scripts/set-version.sh 0.0.0-beta.1; fi
          npx tauri build --debug --bundles "$BUNDLES"
      - name: Package the macOS app unsigned
        if: runner.os == 'macOS'
        env:
          # Pull requests never see the Apple credentials; the release signs.
          PACKAGE_UNSIGNED: "1"
        run: |
          bash desktop/scripts/package-macos.sh "desktop/src-tauri/target/debug/bundle/macos/Actuaria Studio Essentials.app" "$RUNNER_TEMP/Actuaria.dmg" \
            "$RUNNER_TEMP/Actuaria.app.tar.gz"
          # The updater unpacks this over the installed bundle: the .app at the root, nothing else.
          test -z "$(tar -tzf "$RUNNER_TEMP/Actuaria.app.tar.gz" | grep -v '^Actuaria Studio Essentials.app/')"
          tar -tzf "$RUNNER_TEMP/Actuaria.app.tar.gz" | grep -qx 'Actuaria Studio Essentials.app/Contents/MacOS/Actuaria'
      - name: Sign the update payload with a throwaway key
        if: runner.os == 'macOS'
        # As the release does (a relative dist dir from the repository root), with a key made here.
        run: |
          mkdir dist-update
          cp "$RUNNER_TEMP/Actuaria.app.tar.gz" dist-update/Actuaria-Studio-Essentials-v0.0.0-ci-aarch64-apple-darwin.app.tar.gz
          (cd desktop && npx --no-install tauri signer generate --ci -p "" -w "$RUNNER_TEMP/ci-updater.key")
          TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/ci-updater.key")" TAURI_SIGNING_PRIVATE_KEY_PASSWORD="" \
            bash desktop/scripts/sign-updates.sh dist-update v0.0.0-ci "$GITHUB_REPOSITORY"
          jq -e '.version == "0.0.0-ci" and (.platforms["darwin-aarch64"].signature | length > 0)' dist-update/latest.json
      - name: Check the Windows installer
        if: runner.os == 'Windows'
        run: |
          installer=$(ls desktop/src-tauri/target/debug/bundle/nsis/*-setup.exe)
          test -s "$installer"
          # hbench.exe sits beside the app, where it looks for it.
          test -s desktop/src-tauri/target/debug/hbench.exe
      - name: Check the Linux packages
        if: runner.os == 'Linux'
        run: |
          deb=$(ls desktop/src-tauri/target/debug/bundle/deb/*.deb)
          rpm=$(ls desktop/src-tauri/target/debug/bundle/rpm/*.rpm)
          dpkg-deb --info "$deb"
          # Both the app and the bundled hbench must be in the package.
          dpkg-deb --contents "$deb" | grep -iE 'usr/bin/(actuaria|hbench)$' | wc -l | grep -qx 2
          test -s "$rpm"
          # A beta sorts below its release in an rpm, but not in a .deb (docs/RELEASING.md, Beta releases).
          rpm_version=$(rpm -qp --queryformat '%{VERSION}' "$rpm")
          echo "rpm version: $rpm_version"
          [ "$rpm_version" = "0.0.0~beta.1" ] || { echo "::error::the rpm's version is $rpm_version, not 0.0.0~beta.1"; exit 1; }
          deb_version=$(dpkg-deb --field "$deb" Version)
          [ "$deb_version" = "0.0.0-beta.1" ] || { echo "::error::the .deb's version is $deb_version, not 0.0.0-beta.1: update docs/RELEASING.md"; exit 1; }

  e2e:
    # The integrity guarantees (stopping the agent at timeout, the hidden-test scrub, the egress allowlist)
    # only show against a real daemon.
    name: E2E (${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        # scripts/e2e.sh's parts, run in parallel; each is about a third of the suite.
        part: [runs, isolation, cli]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
      - name: Run the e2e suite
        # Its own timeout, below the job's, so a hang still leaves time to upload the job dirs.
        timeout-minutes: 30
        run: scripts/e2e.sh
        env:
          E2E_PART: ${{ matrix.part }}
          E2E_REQUIRE_NFT: "1"
          E2E_JOBS_DIR: ${{ runner.temp }}/e2e-jobs
          # The registry the dataset commands push to and pull from; the same pin as the OCI tests above.
          E2E_REGISTRY_IMAGE: registry:3@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
      - name: Upload the e2e job dirs
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-jobs-${{ matrix.part }}
          path: ${{ runner.temp }}/e2e-jobs
          retention-days: 7

  hbench-action-smoke-test:
    name: hbench-action smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every example task passes with its own solution (oracle)
        uses: node-q/hbench-action@v1
        with:
          version: latest
          path: examples/tasks
          agent: oracle
          n-concurrent: 3
          min-mean-reward: 1
          artifact-name: hbench-examples-oracle
          artifact-retention-days: 7
      - name: No example task passes when nothing is done (nop)
        id: nop
        uses: node-q/hbench-action@v1
        with:
          version: latest
          path: examples/tasks
          agent: nop
          n-concurrent: 3
          upload-artifact: false
      - name: Check that nop scored 0 on every example task
        env:
          MEAN_REWARD: ${{ steps.nop.outputs.mean-reward }}
        run: |
          if [[ "$MEAN_REWARD" != 0.0 ]]; then
            echo "::error::nop scored $MEAN_REWARD on the example tasks: a task passes without the work"
            exit 1
          fi
