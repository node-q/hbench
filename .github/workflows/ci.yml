name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Every job runs on the org's self-hosted pool: GitHub refuses hosted jobs for this
# organisation over billing. The pool is Linux x64 only with no sudo, so macOS is not
# covered here; its jobs have a Docker daemon, which the e2e job uses.
jobs:
  test:
    name: Build & Test
    runs-on: [self-hosted, linux, x64, hpg]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
      - name: Build all targets
        run: cargo build --locked --all-targets
      - name: Run unit tests
        run: cargo test --locked

  lint:
    name: Lint
    runs-on: [self-hosted, linux, x64, hpg]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        env:
          RUSTFLAGS: ""

  viewer:
    # viewer/dist is committed and embedded by build.rs, so it must match viewer/src.
    name: Viewer Bundle
    runs-on: [self-hosted, linux, x64, hpg]
    defaults:
      run:
        working-directory: viewer
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build bundle
        run: npm run build
      - name: Verify committed bundle is up to date
        run: |
          git status --porcelain -- dist
          test -z "$(git status --porcelain -- dist)" || { echo "::error::viewer/dist is stale; run 'npm run build' in viewer/ and commit"; exit 1; }

  e2e:
    # The integrity guarantees (stopping the agent at timeout, the hidden-test scrub, the egress allowlist)
    # only show against a real daemon.
    name: E2E
    runs-on: [self-hosted, linux, x64, hpg]
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
      - name: Run the e2e suite
        run: scripts/e2e.sh
        env:
          E2E_REQUIRE_EGRESS: "1"
