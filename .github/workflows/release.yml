name: Release

# Bump `version` in Cargo.toml, commit, then: git tag vX.Y.Z && git push origin vX.Y.Z
# This publishes the Linux binaries; then run scripts/release-macos.sh vX.Y.Z on a Mac
# (the self-hosted pool is Linux-only and macOS builds need Apple's SDK).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TARGETS: x86_64-unknown-linux-musl aarch64-unknown-linux-musl
  # Every dependency is pure Rust on Linux, so rust-lld links static musl binaries
  # for both arches without musl-tools or a cross gcc (the runner has no sudo).
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld

jobs:
  release:
    name: Build & Publish Release
    runs-on: [self-hosted, linux, x64, hpg]
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Verify tag matches Cargo.toml version
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != Cargo.toml version v$v"; exit 1; }
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - name: Run unit tests
        run: cargo test --locked
      - name: Build release binaries
        run: |
          for target in $TARGETS; do
            cargo build --release --locked --target "$target"
          done
      - name: Package release archives
        run: |
          rm -rf dist && mkdir dist
          for target in $TARGETS; do
            name="hbench-$GITHUB_REF_NAME-$target"
            mkdir "dist/$name"
            cp "target/$target/release/hbench" README.md LICENSE NOTICE "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          done
      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz > SHA256SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: hbench ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
