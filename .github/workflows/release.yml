name: Release

# Bump `version` in Cargo.toml, commit, then: git tag vX.Y.Z && git push origin vX.Y.Z
#
# Each build job builds one binary on a GitHub-hosted runner, with no secrets and a read-only
# token, and attests its archive's build provenance. The ci job waits for ci.yml's run on the
# tagged commit, so only a commit that passed CI on master is released. Only the publish job
# can write: it attests install.sh and SHA256SUMS and creates this repo's release, with the tagged
# commit's scripts/install.sh beside the archives, so `curl -fsSL https://github.com/node-q/hbench/releases/latest/download/install.sh | sh` installs the latest release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI passed on this commit
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    steps:
      - name: Wait for ci.yml on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while :; do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=1" \
              --jq '.workflow_runs[0] | select(.) | "\(.status) \(.conclusion) \(.html_url)"') || run="unreadable"
            case "$run" in
              "completed success "*) echo "CI passed: ${run##* }"; exit 0 ;;
              completed*) echo "::error::CI did not pass on $GITHUB_SHA: $run"; exit 1 ;;
              "") [ "$SECONDS" -lt 120 ] || { echo "::error::ci.yml never ran on a push of $GITHUB_SHA: tag a commit on master"; exit 1; } ;;
            esac
            [ "$SECONDS" -lt 2700 ] || { echo "::error::CI on $GITHUB_SHA still not finished after 45 minutes: $run"; exit 1; }
            sleep 30
          done

  build:
    name: Build (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TARGET: ${{ matrix.target }}
      # ring (TLS for OCI registries) is the one dependency with C code: clang compiles it for both
      # musl arches and the toolchain's llvm-ar archives it, and rust-lld links static binaries,
      # without musl-tools or a cross gcc.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      CC_x86_64_unknown_linux_musl: clang
      CC_aarch64_unknown_linux_musl: clang
      AR_x86_64_unknown_linux_musl: llvm-ar
      AR_aarch64_unknown_linux_musl: llvm-ar
      # macOS tar: no AppleDouble (._*) files or extended attributes in the archives.
      COPYFILE_DISABLE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tag matches Cargo.toml version
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != Cargo.toml version v$v"; exit 1; }
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools
          targets: ${{ matrix.target }}
      - name: Put the toolchain's llvm-ar on PATH
        run: echo "$(rustc --print sysroot)/lib/rustlib/$(rustc --print host-tuple)/bin" >> "$GITHUB_PATH"
      - name: Build the release binary
        run: |
          # Keep the runner's home (checkout, cargo registry, toolchain) out of panic and debug paths.
          export RUSTFLAGS="--remap-path-prefix=$HOME=/build --remap-path-prefix=$PWD=/build/hbench"
          cargo build --release --locked --target "$TARGET"
      - name: Package the release archive
        run: |
          rm -rf dist && mkdir dist
          name="hbench-$GITHUB_REF_NAME-$TARGET"
          mkdir "dist/$name"
          cp "target/$TARGET/release/hbench" README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Upload the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [ci, build]
    runs-on: ubuntu-24.04
    # Only v* tags can deploy to this environment, so no other ref gets this job's write token.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Check out install.sh
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/install.sh
          sparse-checkout-cone-mode: false
          path: src
      - name: Add install.sh
        run: cp src/scripts/install.sh dist/install.sh
      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz install.sh | tee SHA256SUMS
      - name: Attest install.sh and SHA256SUMS
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/install.sh
            dist/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          flags=(--verify-tag --title "hbench $GITHUB_REF_NAME" --generate-notes)
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" "${flags[@]}" dist/*.tar.gz dist/install.sh dist/SHA256SUMS
