name: Release

# Bump `version` in Cargo.toml, commit, then: git tag vX.Y.Z && git push origin vX.Y.Z
#
# The build jobs run the tests and build every binary on GitHub-hosted runners, with no
# secrets and a read-only token, and attest each archive's build provenance. Only the
# publish job can write: it creates this repo's release, which
# `curl -fsSL https://nodeq.tech/install.sh | sh` downloads from.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: Linux
            runner: ubuntu-24.04
            targets: x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          - os: macOS
            runner: macos-15
            targets: aarch64-apple-darwin x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TARGETS: ${{ matrix.targets }}
      # ring (TLS for OCI registries) is the one dependency with C code: clang compiles it for both
      # musl arches, and rust-lld links static binaries, without musl-tools or a cross gcc.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      CC_x86_64_unknown_linux_musl: clang
      CC_aarch64_unknown_linux_musl: clang
      AR_x86_64_unknown_linux_musl: llvm-ar
      AR_aarch64_unknown_linux_musl: llvm-ar
      # macOS tar: no AppleDouble (._*) files or extended attributes in the archives.
      COPYFILE_DISABLE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tag matches Cargo.toml version
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != Cargo.toml version v$v"; exit 1; }
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
      - name: Add the build targets
        run: for t in $TARGETS; do rustup target add "$t"; done
      - name: Run unit tests
        run: cargo test --locked
      - name: Build release binaries
        run: |
          # Keep the runner's home (checkout, cargo registry, toolchain) out of panic and debug paths.
          export RUSTFLAGS="--remap-path-prefix=$HOME=/build --remap-path-prefix=$PWD=/build/hbench"
          for target in $TARGETS; do
            cargo build --release --locked --target "$target"
          done
      - name: Package release archives
        run: |
          rm -rf dist && mkdir dist
          for target in $TARGETS; do
            name="hbench-$GITHUB_REF_NAME-$target"
            mkdir "dist/$name"
            cp "target/$target/release/hbench" README.md LICENSE "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          done
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Upload archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.os }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    # Only v* tags can deploy to this environment, so no other ref gets this job's write token.
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz | tee SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          flags=(--verify-tag --title "hbench $GITHUB_REF_NAME" --generate-notes)
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" "${flags[@]}" dist/*.tar.gz dist/SHA256SUMS
