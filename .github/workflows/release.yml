name: Release build

# How to release: Actions → Release → Run workflow → pick bump → approve.
# That workflow (release-start.yml) bumps the version in a "Release x.y.z" pull request, tags its merge commit
# and starts this one on the tag. By hand still works: bump with scripts/set-version.sh in a pull request,
# merge it, then git tag vX.Y.Z on the merge commit and git push origin vX.Y.Z. See docs/RELEASING.md.
#
# Each build job builds one binary on a GitHub-hosted runner, with no secrets and a read-only
# token, and attests its archive's build provenance. The ci job waits for ci.yml's run on the
# tagged commit, so only a commit that passed CI on master is released. Only the publish job
# can write: it attests install.sh and SHA256SUMS and creates this repo's release, with the tagged
# commit's scripts/install.sh beside the archives, so `curl -fsSL https://github.com/node-q/hbench/releases/latest/download/install.sh | sh` installs the latest release.
#
# Windows gets hbench.exe in a .zip (build-windows) and the app's installer (desktop-windows). Both
# are attested but not Authenticode-signed, so SmartScreen warns on first run. Like the desktop
# jobs, a Windows failure does not hold back the release.
#
# The desktop app, Actuaria Studio Essentials (desktop/), ships with the release: a .dmg per macOS architecture, and a
# .deb and .rpm per Linux architecture (desktop-linux; unsigned, attested like the archives). The
# desktop job builds the macOS app around that release's own hbench binary, again with no secrets.
# desktop-sign then signs and notarizes it with Apple's tools alone. It is the only job that sees
# the Apple credentials, which are secrets of the `release` environment:
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD        a "Developer ID Application" .p12 (base64)
#   APPLE_API_KEY, APPLE_API_KEY_ID, APPLE_API_ISSUER    an App Store Connect API key, to notarize
# Without them the .dmg is still built, ad-hoc signed, and the job says so in a warning. A desktop
# failure does not hold back the hbench release: publish goes ahead without the missing packages.
#
# The app updates itself from the latest release's latest.json (desktop/src-tauri/tauri.conf.json → updater).
# desktop-sign also writes each signed app bundle as an update payload (.app.tar.gz); the Windows installer
# and the Linux packages are their own payloads. desktop-updater signs them all with the updater key and writes
# latest.json. It is the only job that sees that key, a secret of the `release` environment:
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD   from `tauri signer generate`
# Without it the release ships no latest.json, and installed apps see no update. A prerelease is never
# "latest", so apps on the stable channel never see it. Apps on the beta channel read the fixed release
# `beta-channel`'s latest.json instead, which the beta-feed job replaces after each beta (vX.Y.Z-beta.N) or stable
# release newer than the version there.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  # release-start.yml starts this on the tag it creates, since a tag pushed with GITHUB_TOKEN starts no
  # workflow. Run on anything but a v* tag on master, the build and ci jobs fail and nothing is signed,
  # attested or published.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI passed on this commit
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check this is a v* tag on master
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] && [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]] ||
            { echo "::error::release from a v* tag, not $GITHUB_REF"; exit 1; }
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/master...$GITHUB_SHA" --jq .status)
          case "$status" in
            identical|behind) ;;
            *) echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on master ($status): tag a commit on master"; exit 1 ;;
          esac
      - name: Wait for ci.yml on the tagged commit
        run: |
          # A push to master runs ci.yml; so does release-start.yml, on the tag, when the commit was merged under
          # GITHUB_TOKEN (whose push starts no workflow). Either run counts; a pull request's run does not.
          while :; do
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=20" \
              --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")]
                    | (map(select(.conclusion == "success")) + map(select(.status != "completed")) + .)[0] | select(.)
                    | "\(.status) \(.conclusion) \(.html_url)"') || run="unreadable"
            case "$run" in
              "completed success "*) echo "CI passed: ${run##* }"; exit 0 ;;
              completed*) echo "::error::CI did not pass on $GITHUB_SHA: $run"; exit 1 ;;
              "") [ "$SECONDS" -lt 300 ] || { echo "::error::ci.yml never ran on $GITHUB_SHA: tag a commit on master"; exit 1; } ;;
            esac
            [ "$SECONDS" -lt 2700 ] || { echo "::error::CI on $GITHUB_SHA still not finished after 45 minutes: $run"; exit 1; }
            sleep 30
          done

  build:
    name: Build (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TARGET: ${{ matrix.target }}
      # ring (TLS for OCI registries) is the one dependency with C code: clang compiles it for both
      # musl arches and the toolchain's llvm-ar archives it, and rust-lld links static binaries,
      # without musl-tools or a cross gcc.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      CC_x86_64_unknown_linux_musl: clang
      CC_aarch64_unknown_linux_musl: clang
      AR_x86_64_unknown_linux_musl: llvm-ar
      AR_aarch64_unknown_linux_musl: llvm-ar
      # macOS tar: no AppleDouble (._*) files or extended attributes in the archives.
      COPYFILE_DISABLE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tag matches Cargo.toml version
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] || { echo "::error::build releases from a tag, not $GITHUB_REF"; exit 1; }
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != Cargo.toml version v$v"; exit 1; }
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          components: llvm-tools
          targets: ${{ matrix.target }}
      - name: Put the toolchain's llvm-ar on PATH
        run: echo "$(rustc --print sysroot)/lib/rustlib/$(rustc --print host-tuple)/bin" >> "$GITHUB_PATH"
      - name: Build the release binary
        run: |
          # Keep the runner's home (checkout, cargo registry, toolchain) out of panic and debug paths.
          export RUSTFLAGS="--remap-path-prefix=$HOME=/build --remap-path-prefix=$PWD=/build/hbench"
          cargo build --release --locked --target "$TARGET"
      - name: Package the release archive
        run: |
          rm -rf dist && mkdir dist
          name="hbench-$GITHUB_REF_NAME-$TARGET"
          mkdir "dist/$name"
          cp "target/$TARGET/release/hbench" README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Upload the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: Build (x86_64-pc-windows-msvc)
    runs-on: windows-2025
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        # Windows runners default to PowerShell.
        shell: bash
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tag matches Cargo.toml version
        run: |
          [ "$GITHUB_REF_TYPE" = tag ] || { echo "::error::build releases from a tag, not $GITHUB_REF"; exit 1; }
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != Cargo.toml version v$v"; exit 1; }
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
      - name: Build the release binary
        run: cargo build --release --locked --target "$TARGET"
      - name: Package the release archive
        run: |
          # A .zip, which Windows opens without extra tools.
          name="hbench-$GITHUB_REF_NAME-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/hbench.exe" README.md LICENSE "dist/$name/"
          (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
          rm -r "dist/$name"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Upload the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-x86_64-pc-windows-msvc
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  desktop-windows:
    name: Desktop app (x86_64-pc-windows-msvc)
    needs: build-windows
    runs-on: windows-2025
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Download this release's hbench
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-x86_64-pc-windows-msvc
          path: dist
      - name: Bundle that hbench as the app's sidecar
        run: |
          name="hbench-$GITHUB_REF_NAME-$TARGET"
          (cd dist && 7z x "$name.zip" > /dev/null)
          mkdir -p desktop/src-tauri/binaries
          cp "dist/$name/hbench.exe" "desktop/src-tauri/binaries/hbench-$TARGET.exe"
      - name: Give the app the release's version
        run: sh desktop/scripts/set-version.sh "${GITHUB_REF_NAME#v}"
      - name: Build the installer
        working-directory: desktop
        run: |
          npm ci --ignore-scripts
          npx tauri build --bundles nsis
      - name: Name the installer after the release
        run: |
          mkdir out
          cp desktop/src-tauri/target/release/bundle/nsis/*-setup.exe "out/Actuaria-Studio-Essentials-$GITHUB_REF_NAME-$TARGET-setup.exe"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/Actuaria-*
      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-desktop-x86_64-pc-windows-msvc
          path: out/Actuaria-*
          if-no-files-found: error
          retention-days: 7

  desktop:
    name: Desktop app (${{ matrix.target }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: [self-hosted, macos-15]
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
      COPYFILE_DISABLE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Download this release's hbench
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist
      - name: Bundle that hbench as the app's sidecar
        run: |
          # The app runs the binary the build job attested, not a second build of it.
          name="hbench-$GITHUB_REF_NAME-$TARGET"
          tar -C dist -xzf "dist/$name.tar.gz"
          mkdir -p desktop/src-tauri/binaries
          cp "dist/$name/hbench" "desktop/src-tauri/binaries/hbench-$TARGET"
      - name: Give the app the release's version
        run: sh desktop/scripts/set-version.sh "${GITHUB_REF_NAME#v}"
      - name: Build the app bundle
        working-directory: desktop
        run: |
          npm ci --ignore-scripts
          export RUSTFLAGS="--remap-path-prefix=$HOME=/build --remap-path-prefix=$GITHUB_WORKSPACE=/build/hbench"
          npx tauri build --target "$TARGET" --bundles app
      - name: Archive the app
        run: |
          # tar keeps the bundle's modes and symlinks, which a bare artifact upload would not.
          mkdir app
          tar -C "desktop/src-tauri/target/$TARGET/release/bundle/macos" -cf "app/Actuaria-$TARGET.app.tar" "Actuaria Studio Essentials.app"
      - name: Upload the app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ matrix.target }}
          path: app/*.app.tar
          if-no-files-found: error
          retention-days: 7

  desktop-linux:
    name: Desktop app (${{ matrix.target }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # Built on the oldest Ubuntu supported, so the packages run on its glibc and WebKitGTK and newer
        # (Ubuntu 22.04+, Debian 12+, Fedora 38+). The app links glibc; the hbench inside is the static
        # musl binary of the same architecture.
        include:
          - target: x86_64-unknown-linux-gnu
            hbench: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            hbench: aarch64-unknown-linux-musl
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TARGET: ${{ matrix.target }}
      HBENCH_TARGET: ${{ matrix.hbench }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install WebKitGTK and build dependencies
        run: sh desktop/scripts/linux-deps.sh
      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Download this release's hbench
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ matrix.hbench }}
          path: dist
      - name: Bundle that hbench as the app's sidecar
        run: |
          name="hbench-$GITHUB_REF_NAME-$HBENCH_TARGET"
          tar -C dist -xzf "dist/$name.tar.gz"
          mkdir -p desktop/src-tauri/binaries
          cp "dist/$name/hbench" "desktop/src-tauri/binaries/hbench-$TARGET"
      - name: Give the app the release's version
        run: sh desktop/scripts/set-version.sh "${GITHUB_REF_NAME#v}"
      - name: Build the .deb and .rpm
        working-directory: desktop
        run: |
          npm ci --ignore-scripts
          export RUSTFLAGS="--remap-path-prefix=$HOME=/build --remap-path-prefix=$GITHUB_WORKSPACE=/build/hbench"
          npx tauri build --bundles deb,rpm
      - name: Name the packages after the release
        run: |
          bundle=desktop/src-tauri/target/release/bundle
          mkdir out
          cp "$bundle"/deb/*.deb "out/Actuaria-Studio-Essentials-$GITHUB_REF_NAME-$TARGET.deb"
          cp "$bundle"/rpm/*.rpm "out/Actuaria-Studio-Essentials-$GITHUB_REF_NAME-$TARGET.rpm"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/Actuaria-*
      - name: Upload the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-desktop-${{ matrix.target }}
          path: out/Actuaria-*
          if-no-files-found: error
          retention-days: 7

  desktop-sign:
    name: Sign desktop app (${{ matrix.target }})
    needs: [ci, desktop]
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: [self-hosted, macos-15]
    # Only v* tags can deploy to this environment, so no other ref can read the Apple credentials.
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: Check out the packaging script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: desktop/scripts/package-macos.sh
          sparse-checkout-cone-mode: false
          path: src
      - name: Download the app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-${{ matrix.target }}
          path: app
      - name: Sign, package and notarize
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          tar -C app -xf "app/Actuaria-$TARGET.app.tar"
          bash src/desktop/scripts/package-macos.sh "app/Actuaria Studio Essentials.app" "dist/Actuaria-Studio-Essentials-$GITHUB_REF_NAME-$TARGET.dmg" \
            "update/Actuaria-Studio-Essentials-$GITHUB_REF_NAME-$TARGET.app.tar.gz"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.dmg
            update/*.app.tar.gz
      - name: Upload the disk image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-desktop-${{ matrix.target }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7
      - name: Upload the update payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-${{ matrix.target }}
          path: update/*.app.tar.gz
          if-no-files-found: error
          retention-days: 7

  desktop-updater:
    name: Sign app updates
    needs: [ci, desktop-sign, desktop-linux, desktop-windows]
    # Whatever desktop packages were built get offered; a missing one leaves its platform out of latest.json.
    if: ${{ !cancelled() && needs.ci.result == 'success' }}
    runs-on: ubuntu-24.04
    # Only v* tags can deploy to this environment, so no other ref can read the updater key.
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        if: env.HAS_KEY == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the Tauri CLI
        if: env.HAS_KEY == 'true'
        # The same locked CLI that built the app (and so already shapes what users run) does the signing.
        working-directory: desktop
        run: npm ci --ignore-scripts
      - name: Download the desktop packages
        if: env.HAS_KEY == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-desktop-*
          merge-multiple: true
          path: dist
      - name: Download the macOS update payloads
        if: env.HAS_KEY == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: update-*
          merge-multiple: true
          path: dist
      - name: Sign the payloads and write latest.json
        if: env.HAS_KEY == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          bash desktop/scripts/sign-updates.sh dist "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"
          # The packages themselves reach publish from their own jobs; this one adds what it made.
          mkdir out
          shopt -s nullglob
          mv dist/*.sig dist/*.app.tar.gz dist/latest.json out/
      - name: Say the release ships without updates
        if: env.HAS_KEY != 'true'
        run: |
          echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: this release has no latest.json, so installed apps are not offered it"
      - name: Attest build provenance
        if: env.HAS_KEY == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/latest.json
      - name: Upload the signatures and manifest
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-updater
          path: out/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [ci, build, build-windows, desktop-sign, desktop-linux, desktop-windows, desktop-updater]
    # hbench is released even when the desktop app failed to build or sign.
    if: ${{ !cancelled() && needs.ci.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    # Only v* tags can deploy to this environment, so no other ref gets this job's write token.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Check out install.sh
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/install.sh
          sparse-checkout-cone-mode: false
          path: src
      - name: Add install.sh
        run: cp src/scripts/install.sh dist/install.sh
      - name: Generate checksums
        working-directory: dist
        run: |
          shopt -s nullglob
          # 2 .dmg (macOS), 2 .deb and 2 .rpm (Linux), 1 installer (Windows).
          apps=(Actuaria-*.dmg Actuaria-*.deb Actuaria-*.rpm Actuaria-*-setup.exe)
          [ "${#apps[@]}" -eq 7 ] || echo "::warning::expected 7 desktop packages, found ${#apps[@]} (${apps[*]}): this release ships without the missing ones"
          zips=(*.zip)
          [ "${#zips[@]}" -eq 1 ] || echo "::warning::hbench for Windows is missing from this release"
          # The app's updates: macOS payloads, a signature per package and latest.json (desktop-updater).
          updates=(Actuaria-*.app.tar.gz Actuaria-*.sig latest*.json)
          [ -f latest.json ] || echo "::warning::latest.json is missing: installed apps will not be offered this release"
          # *.tar.gz would list the macOS update payloads twice.
          archives=(hbench-*.tar.gz)
          sha256sum -- "${archives[@]}" "${zips[@]}" "${apps[@]}" "${updates[@]}" install.sh | tee SHA256SUMS
      - name: Attest install.sh and SHA256SUMS
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/install.sh
            dist/SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          flags=(--verify-tag --title "hbench $GITHUB_REF_NAME" --generate-notes)
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          else
            # A stable release's notes cover everything since the previous stable release, not since its last beta.
            stable=$(gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName --jq '.[].tagName')
            previous=$(printf '%s\n' "$stable" "$GITHUB_REF_NAME" | grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -uV |
              awk -v tag="$GITHUB_REF_NAME" '$0 == tag { print last; exit } { last = $0 }')
            [ -z "$previous" ] || flags+=(--notes-start-tag "$previous")
          fi
          shopt -s nullglob
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" "${flags[@]}" dist/hbench-*.tar.gz dist/*.zip dist/Actuaria-* dist/latest*.json dist/install.sh dist/SHA256SUMS
      - name: Summarize the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json url,assets --jq \
            '"## hbench \(.url | split("/") | last)\n\n**Release:** \(.url)\n\n| File | Size |\n|---|---:|",
             (.assets[] | "| [\(.name)](\(.url)) | \(.size / 1048576 * 10 | round / 10) MB |")' >> "$GITHUB_STEP_SUMMARY"

  beta-feed:
    # Apps on the beta channel read https://github.com/node-q/hbench/releases/download/beta-channel/latest.json. A
    # beta or a stable release newer than what is there replaces it (scripts/beta-feed.sh). The feed is this
    # release's own signed latest.json, whose URLs point at this release's assets; nothing is re-signed here. A job
    # of its own, so that it can be re-run alone once the release is out.
    name: Update the beta channel's feed
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only v* tags can deploy to this environment, so no other ref gets this job's write token.
    environment: release
    permissions:
      contents: write
    # One release at a time reads and replaces the feed. GitHub keeps one waiting run: with three at once the
    # middle one is cancelled, so re-run it (an older version than the feed's changes nothing).
    concurrency:
      group: beta-feed
      cancel-in-progress: false
    steps:
      - name: Check out beta-feed.sh
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/beta-feed.sh
          sparse-checkout-cone-mode: false
          path: src
      - name: Download latest.json
        # By pattern: with no such artifact (a release without the updater key) this downloads nothing and passes.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-updater
          merge-multiple: true
          path: dist
      - name: Update the feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f dist/latest.json ] || { echo "::warning::no latest.json: the beta channel is unchanged"; exit 0; }
          bash src/scripts/beta-feed.sh update dist/latest.json "$GITHUB_REF_NAME"
