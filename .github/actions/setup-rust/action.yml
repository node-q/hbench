name: Setup Rust
description: The Rust toolchain pinned in rust-toolchain.toml, plus the cargo cache.
inputs:
  components:
    description: Comma-separated rustup components (e.g. clippy)
    default: ""
  targets:
    description: Comma-separated extra compilation targets
    default: ""
runs:
  using: composite
  steps:
    - name: Read pinned toolchain
      id: pin
      shell: bash
      run: echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: ${{ steps.pin.outputs.channel }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}
    - name: Restore cargo cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
