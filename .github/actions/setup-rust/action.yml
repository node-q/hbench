name: Setup Rust
description: >
  Rust toolchain + cargo cache for the self-hosted pool. starship-hpg-1..4 share one
  user (runner-hpg), so a shared ~/.rustup gets corrupted by concurrent installs;
  keep rustup/cargo homes in each runner instance's own tool cache instead.
inputs:
  components:
    description: Comma-separated rustup components (e.g. clippy)
    default: ""
  targets:
    description: Comma-separated extra compilation targets
    default: ""
runs:
  using: composite
  steps:
    - name: Isolate rustup and cargo homes per runner instance
      shell: bash
      run: |
        echo "RUSTUP_HOME=$RUNNER_TOOL_CACHE/rustup" >> "$GITHUB_ENV"
        echo "CARGO_HOME=$RUNNER_TOOL_CACHE/cargo" >> "$GITHUB_ENV"
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}
    - name: Restore cargo cache
      uses: Swatinem/rust-cache@v2
