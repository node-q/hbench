[package]
name = "actuaria-desktop"
version = "0.4.1"
description = "Actuaria.io desktop studio, built on hbench"
edition = "2024"
license = "Apache-2.0"
publish = false

# Its own workspace: hbench's crate and lockfile stay untouched.
[workspace]

[[bin]]
name = "actuaria"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["time"] }
getrandom = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
